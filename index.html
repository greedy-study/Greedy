<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAIVIPPRO - Trang Chủ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            margin-top: 50px;
        }
        h1 {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        .admin-box {
            margin-top: 30px;
            padding: 20px;
            background: #1a1a1a;
            display: inline-block;
            border-radius: 8px;
            border: 1px solid #333;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #ff3333;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #e60000;
        }
        ul {
            list-style: none;
            padding: 0;
            text-align: left;
        }
        li {
            background: #262626;
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo" width="100" style="border-radius: 50%; box-shadow: 0 0 15px rgba(255,51,51,0.5);">
        <h1>KHAIVIPPRO SHOP</h1>
        <p>Hệ thống đặt hàng trực tuyến thông minh đã kết nối Database!</p>

        <!-- Form đặt hàng cho khách -->
        <div class="admin-box">
            <h3>Đặt Hàng Ngay</h3>
            <input type="text" id="customerName" placeholder="Tên của bạn"><br>
            <input type="text" id="productName" placeholder="Sản phẩm muốn mua"><br>
            <button onclick="submitOrder()">Gửi Đơn Hàng</button>
        </div>

        <!-- Khu vực hiển thị đơn hàng cho Admin -->
        <div class="admin-box" style="margin-left: 20px;">
            <h3>Bảng Quản Lý Admin (Đơn hàng tự động cập nhật)</h3>
            <ul id="orderList">
                <li>Đang tải dữ liệu từ đám mây...</li>
            </ul>
        </div>
    </div>

    <!-- Nhúng Firebase SDK phiên bản tương thích -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDwL-Wvjb53oZlAv8ep393OV7bLIgi8_Z4",
            authDomain: "khaivippro.firebaseapp.com",
            projectId: "khaivippro",
            storageBucket: "khaivippro.firebasestorage.app",
            messagingSenderId: "51155639696",
            appId: "1:51155639696:web:103ab4922d4736d5be6715",
            measurementId: "G-D1CTKFWQM7"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Hàm gửi đơn hàng lên Database
        window.submitOrder = function() {
            const name = document.getElementById('customerName').value;
            const product = document.getElementById('productName').value;

            if(!name || !product) {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            const ordersRef = ref(db, 'orders');
            const newOrderRef = push(ordersRef);
            
            set(newOrderRef, {
                customer: name,
                product: product,
                time: new Date().toLocaleString()
            }).then(() => {
                alert("Đặt hàng thành công! Đã gửi lên hệ thống.");
                document.getElementById('customerName').value = '';
                document.getElementById('productName').value = '';
            }).catch((error) => {
                alert("Lỗi: " + error.message);
            });
        };

        // Lắng nghe dữ liệu thay đổi từ Database để hiển thị thời gian thực (Realtime)
        const ordersRef = ref(db, 'orders');
        onValue(ordersRef, (snapshot) => {
            const listElement = document.getElementById('orderList');
            listElement.innerHTML = '';
            
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach((order) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<b>${order.customer}</b> đã đặt: <i>${order.product}</i> <br><small style="color: #aaa;">(${order.time})</small>`;
                    listElement.appendChild(li);
                });
            } else {
                listElement.innerHTML = '<li>Chưa có đơn hàng nào.</li>';
            }
        });
    </script>
</body>
</html>
